name: daily maze

# figure 2 gets a brand new maze every day, seeded by the date

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-maze
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install numpy "fonttools[woff]" uharfbuzz shapely

      - name: draw today's maze
        working-directory: src
        run: python maze.py --daily

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maze.svg
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "maze for $(date -u +%F)"
            git push
          fi
